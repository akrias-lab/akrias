<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impact Immo - Démo IA Dynamique</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #ffffff; 
            font-family: 'Montserrat', Helvetica, Arial, sans-serif;
        }
        .container {
            width: 100%;
            text-align: center;
        }
        .img-site {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="asset/impactImmo.png" class="img-site" alt="Interface Impact Immo">
    </div>

    <script type="text/javascript">
  (function(d, t) {
      console.log("🟢 Voiceflow : Initialisation du nouveau projet Impact Immo...");
      var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
      
      v.onload = function() {
        window.voiceflow.chat.load({
          verify: { projectID: '698c6d9ca7709993f962a39a' }, // Ton nouvel ID
          url: 'https://general-runtime.voiceflow.com',
          versionID: 'production',
          voice: {
            url: "https://runtime-api.voiceflow.com"
          },
          theme: {
            color: '#004C2C', // Vert Impact Immo officiel
            showPoweredBy: false,
            assistant: {
              title: "Assistant Impact Immo",
              placeholder: "Comment puis-je vous aider ?",
              image: "https://impact-immo.com/favicon.ico" 
            }
          }
        }).then(() => {
          console.log("🚀 Widget Impact Immo (Projet 698) activé.");
          
          // Message 1 : Accueil dynamique
          setTimeout(() => {
            window.voiceflow.chat.proactive.push({ 
              type: 'text', 
              payload: { message: "Bonjour ! Bienvenue chez Impact Immo. 🏠" } 
            });
          }, 1000);

          // Message 2 : Focus Ouest Parisien
          setTimeout(() => {
            window.voiceflow.chat.proactive.push({ 
              type: 'text', 
              payload: { message: "Un projet à Boulogne, Issy, Levallois ou Paris ? Je suis là pour vous conseiller. Une estimation ? ✨" } 
            });
          }, 3500);

          // Ouverture automatique (6 secondes)
          setTimeout(() => {
            window.voiceflow.chat.open();
          }, 6000);
          
        });
      }
      v.src = "https://cdn.voiceflow.com/widget-next/bundle.mjs"; v.type = "text/javascript"; s.parentNode.insertBefore(v, s);
  })(document, 'script');
</script>

</body>
</html>
